  # Attachment Module
  /attachments:
    get:
      summary: Get a list of attachments
      tags:
        - Attachment
      description: Retrieve attachments with optional filters, pagination, and sorting.
      parameters:
        - name: filter
          in: query
          description: JSON object to filter the attachments Should be passed as a JSON string
          required: false
          schema:
            type: string
            example: '{"where": {"class": "document"}}'
        - name: limit
          in: query
          description: Limit the number of attachments returned.
          required: false
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          description: Number of attachments to skip before starting to collect the result set.
          required: false
          schema:
            type: integer
            example: 0
      responses:
        "200":
          description: Attachments fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Total count of attachments matching the filter criteria.
                        example: 50
                      rows:
                        type: array
                        description: List of attachments.
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier of the attachment.
                              example: 1
                            class:
                              type: string
                              description: Class/type of the attachment.
                              example: "document"
                            is_primary:
                              type: boolean
                              description: Indicates if the attachment is primary.
                              example: true
                            foreign_id:
                              type: integer
                              description: ID of the related entity.
                              example: 5
                            file_name:
                              type: string
                              description: Name of the file.
                              example: "example.pdf"
                            dir:
                              type: string
                              description: Directory where the file is stored.
                              example: "/uploads/documents"
                            file_size:
                              type: integer
                              description: Size of the file in bytes.
                              example: 204800
                            createdAt:
                              type: string
                              format: date-time
                              description: Creation timestamp of the attachment.
                              example: "2024-11-04T10:00:00Z"
                            updatedAt:
                              type: string
                              format: date-time
                              description: Last update timestamp of the attachment.
                              example: "2024-11-04T10:00:00Z"
                  message:
                    type: string
                    example: "Attachments fetched successfully"
        "422":
          description: Unprocessable Entity - Something went wrong
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 422
                  data:
                    type: "null"
                  message:
                    type: string
                    example: "Something Went wrong"
    post:
      summary: Upload the file
      tags:
        - Attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Choose the file to upload
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "File uploaded successfully"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - http: []
  /attachments/{id}:
    delete:
      summary: delete attachment details
      parameters:
        - name: id
